<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Sky Hopper 3.0</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1220;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
body{display:grid;place-items:center}
#wrap{position:relative;width:min(100vw,520px);height:min(100vh,860px);overflow:hidden;background:#101a2b;box-shadow:0 18px 70px #0008}
canvas{width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;inset:0;pointer-events:none;color:#fff}
#score{position:absolute;top:18px;left:50%;transform:translateX(-50%);font-size:42px;font-weight:900;text-shadow:0 3px 10px #0008}
#world{position:absolute;left:14px;top:14px;padding:7px 11px;border-radius:14px;background:#0004;backdrop-filter:blur(5px);font-size:12px;font-weight:800;letter-spacing:.7px}
#mute{position:absolute;right:14px;top:14px;border:0;border-radius:14px;padding:8px 11px;background:#0005;color:#fff;font-size:16px;cursor:pointer;pointer-events:auto}
.panel{position:absolute;inset:0;display:grid;place-items:center;background:#0004;pointer-events:auto;transition:opacity .25s ease}
.card{width:min(90%,400px);padding:28px;border-radius:28px;background:linear-gradient(145deg,#17283bfa,#0d1827f5);color:#fff;text-align:center;box-shadow:0 20px 70px #0009;border:1px solid #ffffff18}
.card h1{margin:0 0 6px;font-size:34px}
.card p{margin:8px 0 18px;color:#b9c7d5;font-size:14px}
button.start{border:0;border-radius:16px;padding:13px 25px;font-size:16px;font-weight:900;background:#ffffff;color:#142438;cursor:pointer;box-shadow:0 8px 24px #0004;width:100%}
button.link{border:0;background:none;color:#9fb4c9;text-decoration:underline;font-size:13px;cursor:pointer;margin-top:12px;pointer-events:auto}
.hidden{display:none!important}

.birdgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.birdcard{border-radius:16px;padding:10px 6px;background:#ffffff0d;border:2px solid transparent;cursor:pointer;transition:.15s;pointer-events:auto}
.birdcard:hover{background:#ffffff1a}
.birdcard.selected{border-color:#fff;background:#ffffff22}
.birdswatch{width:52px;height:44px;border-radius:50%;margin:0 auto 6px;box-shadow:0 4px 10px #0006,inset 0 -6px 10px #00000033}
.birdcard span{font-size:11px;font-weight:700;color:#dbe7f2;display:block}
</style>
</head>
<body>
<div id="wrap">
<canvas id="game"></canvas>
<div id="hud">
  <div id="world">SUMMER • DAY</div>
  <div id="score">0</div>
  <button id="mute">🔊</button>

  <div class="panel" id="menuPanel">
    <div class="card">
      <h1>Ready to Fly?</h1>
      <p>A smooth flight through a changing world.</p>
      <button class="start" id="menuPlay">PLAY</button>
    </div>
  </div>

  <div class="panel hidden" id="selectPanel">
    <div class="card">
      <h1 style="font-size:26px">Choose Your Bird</h1>
      <p>Pick a look, then take off.</p>
      <div class="birdgrid" id="birdGrid"></div>
      <button class="start" id="selectPlay">START FLIGHT</button>
    </div>
  </div>

  <div class="panel hidden" id="overPanel">
    <div class="card">
      <h1>Flight Over</h1>
      <p id="sub">Score 0 • Best 0</p>
      <button class="start" id="overPlay">PLAY AGAIN</button>
      <button class="link" id="changeBird">Change Bird</button>
    </div>
  </div>
</div>
</div>
<script>
const c=document.getElementById('game'),x=c.getContext('2d');
const wrap=document.getElementById('wrap');
let W=520,H=860,dpr=1;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=wrap.clientWidth;H=wrap.clientHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();

// ---------------- BIRD SKINS (Classic + Red/Blue/Pink/Purple as requested) ----------------
const birdSkins=[
 {name:'Classic',   body:['#ffffff','#f0f3f7','#8c9baa'], helmet:'#26384b', wing:'#465a70', wingLine:'#a8bfd5', cheek:'#ef5d61'},
 {name:'Blaze Red', body:['#ffe3e3','#ff6b6b','#a02323'], helmet:'#5c1414', wing:'#7a1f1f', wingLine:'#ffb3b3', cheek:'#ffd75e'},
 {name:'Sky Blue',  body:['#e2f4ff','#5fb8ff','#1f5f96'], helmet:'#123a5c', wing:'#1f4e70', wingLine:'#bfe8ff', cheek:'#ffd75e'},
 {name:'Blossom Pink', body:['#ffe6f5','#ff8fd0','#c23f95'], helmet:'#701b52', wing:'#8f2a6b', wingLine:'#ffd3ef', cheek:'#ffd75e'},
 {name:'Royal Purple', body:['#f0e6ff','#b07dff','#5a2a99'], helmet:'#33125c', wing:'#48227d', wingLine:'#ddc4ff', cheek:'#ffd75e'}
];
let selectedSkin=0;

function buildBirdGrid(){
 const grid=document.getElementById('birdGrid');
 grid.innerHTML='';
 birdSkins.forEach((s,i)=>{
   const el=document.createElement('div');
   el.className='birdcard'+(i===selectedSkin?' selected':'');
   el.innerHTML=`<div class="birdswatch" style="background:radial-gradient(circle at 35% 30%, ${s.body[0]}, ${s.body[1]} 55%, ${s.body[2]} 100%)"></div><span>${s.name}</span>`;
   el.onclick=()=>{selectedSkin=i;document.querySelectorAll('.birdcard').forEach(b=>b.classList.remove('selected'));el.classList.add('selected')};
   grid.appendChild(el);
 });
}
buildBirdGrid();

let state='menu',score=0,best=+localStorage.skyHopperBest||0;
let bird={x:W*.27,y:H*.45,vy:0,r:18,rot:0};
let pipes=[],items=[],parts=[],clouds=[];
let t=0,last=0,worldTime=0,muted=false,rocketTimer=0,shieldTimer=0,magnetTimer=0;
let seasonIndex=0,weatherIndex=0,lightningFlash=0,lightningCooldown=2;
const seasons=[
 {name:'SUMMER',sky1:'#74d9ff',sky2:'#dff9ff',ground:'#5eaf45'},
 {name:'AUTUMN',sky1:'#e89c61',sky2:'#ffe5b6',ground:'#80613f'},
 {name:'WINTER',sky1:'#789cc7',sky2:'#dbeaf7',ground:'#cbd7df'},
 {name:'SPRING',sky1:'#72d8c0',sky2:'#e4fff4',ground:'#55a96a'}
];
// ---- weather now includes STORM (thunderstorm) ----
const weather=['CLEAR','RAIN','SNOW','STORM'];

// ---- season change slowed back down + long smooth blend window (gradual, not sudden) ----
const SEASON_CYCLE=50;
const SEASON_BLEND=20;

function hexToRgb(hex){
 const h=hex.replace('#','');
 return [parseInt(h.substring(0,2),16),parseInt(h.substring(2,4),16),parseInt(h.substring(4,6),16)];
}
function lerpColor(hexA,hexB,p){
 const a=hexToRgb(hexA),b=hexToRgb(hexB);
 const r=Math.round(a[0]+(b[0]-a[0])*p);
 const g=Math.round(a[1]+(b[1]-a[1])*p);
 const bl=Math.round(a[2]+(b[2]-a[2])*p);
 return `rgb(${r},${g},${bl})`;
}

let audio=null,master=null,melodyTimer=null;
function audioInit(){
 if(audio)return;
 audio=new (window.AudioContext||window.webkitAudioContext)();
 master=audio.createGain();master.gain.value=.16;master.connect(audio.destination); // was .055 -> much louder now
}
function tone(freq,dur,type='sine',gain=.18,when=0){
 if(muted||!audio)return;
 const o=audio.createOscillator(),g=audio.createGain();
 o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.0001,audio.currentTime+when);
 g.gain.exponentialRampToValueAtTime(gain,audio.currentTime+when+.02);
 g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+when+dur);
 o.connect(g);g.connect(master);o.start(audio.currentTime+when);o.stop(audio.currentTime+when+dur+.03);
}
function noiseBurst(dur,gain){
 if(muted||!audio)return;
 const bufferSize=audio.sampleRate*dur;
 const buffer=audio.createBuffer(1,bufferSize,audio.sampleRate);
 const data=buffer.getChannelData(0);
 for(let i=0;i<bufferSize;i++)data[i]=(Math.random()*2-1)*(1-i/bufferSize);
 const src=audio.createBufferSource();src.buffer=buffer;
 const g=audio.createGain();g.gain.value=gain;
 const filt=audio.createBiquadFilter();filt.type='lowpass';filt.frequency.value=380;
 src.connect(filt);filt.connect(g);g.connect(master);src.start();
}
function sfx(kind){
 audioInit();
 if(kind==='coin'){tone(660,.09,'triangle',.22);tone(990,.14,'triangle',.16,.07)}
 if(kind==='shield'){tone(330,.14,'sine',.2);tone(660,.22,'sine',.16,.1)}
 if(kind==='rocket'){tone(220,.18,'sawtooth',.12);tone(440,.26,'triangle',.14,.12)}
 if(kind==='magnet'){tone(500,.1,'square',.16);tone(750,.12,'square',.14,.08);tone(1000,.16,'square',.12,.16)}
 if(kind==='flap')tone(260,.06,'triangle',.07)
 if(kind==='crash'){tone(110,.25,'sawtooth',.16);tone(70,.35,'sine',.1,.1)}
 if(kind==='thunder'){noiseBurst(.7,.28);tone(60,.6,'sine',.15,.05)}
}
function ambience(){
 audioInit(); if(muted)return;
 if(melodyTimer)return;
 const notes=[261.63,329.63,392,493.88,392,329.63];
 let i=0;
 melodyTimer=setInterval(()=>{if(!muted)tone(notes[i++%notes.length],.55,'sine',.03)},720);
}
function stopAudio(){if(melodyTimer){clearInterval(melodyTimer);melodyTimer=null}}

function reset(){
 score=0; bird={x:W*.27,y:H*.44,vy:0,r:18,rot:0}; pipes=[];items=[];parts=[];clouds=[];
 rocketTimer=shieldTimer=magnetTimer=0;worldTime=0;seasonIndex=0;weatherIndex=0;lightningFlash=0;lightningCooldown=3;
 for(let i=0;i<8;i++)clouds.push({x:Math.random()*W,y:60+Math.random()*280,s:35+Math.random()*65,v:5+Math.random()*10});
 spawnPipe(W*.92);
  spawnPipe(W*1.62);
}
function spawnPipe(px=W+30){
  const gap=Math.min(225,H*.30);
  const w=70,capH=18,capOver=7;
  const playBottom=H*.80;
  const minTop=125;
  const maxTop=playBottom-gap-125;
  const topY=minTop+Math.random()*Math.max(1,maxTop-minTop);
  const cy=topY+gap/2;

  pipes.push({
    x:px,w,cy,gap,capH,capOver,
    color:['#31c56a','#328be5','#e24f57'][Math.floor(Math.random()*3)],
    passed:false
  });

  const r=Math.random();
  const iy=topY+gap*.5+(Math.random()-.5)*gap*.45;
  if(r<.55)items.push({x:px+w/2,y:iy,type:'coin',got:false,seed:Math.random()*Math.PI*2});
  else if(r<.72)items.push({x:px+w/2,y:iy,type:'shield',got:false,seed:Math.random()*Math.PI*2});
  else if(r<.86)items.push({x:px+w/2,y:iy,type:'rocket',got:false,seed:Math.random()*Math.PI*2});
  else items.push({x:px+w/2,y:iy,type:'magnet',got:false,seed:Math.random()*Math.PI*2});
}
function flap(){
 if(state!=='play')return;
 bird.vy=-235; sfx('flap');
 for(let i=0;i<5;i++)parts.push({x:bird.x-12,y:bird.y+8,vx:-1-Math.random()*2,vy:(Math.random()-.5)*2,life:1,type:'spark'});
}

// ---------------- STATE / SCREEN FLOW ----------------
function showMenu(){state='menu';document.getElementById('menuPanel').classList.remove('hidden');document.getElementById('selectPanel').classList.add('hidden');document.getElementById('overPanel').classList.add('hidden')}
function showSelect(){state='select';document.getElementById('menuPanel').classList.add('hidden');document.getElementById('selectPanel').classList.remove('hidden');document.getElementById('overPanel').classList.add('hidden');buildBirdGrid()}
function startGame(){audioInit();audio.resume();ambience();state='play';document.getElementById('selectPanel').classList.add('hidden');document.getElementById('overPanel').classList.add('hidden');reset()}
function gameOver(){
 if(state!=='play')return;
 state='over';best=Math.max(best,score);localStorage.skyHopperBest=best;sfx('crash');
 document.getElementById('overPanel').classList.remove('hidden');
 document.getElementById('sub').textContent=`Score ${score}  •  Best ${best}`;
}
document.getElementById('menuPlay').onclick=showSelect;
document.getElementById('selectPlay').onclick=startGame;
document.getElementById('overPlay').onclick=startGame;
document.getElementById('changeBird').onclick=showSelect;
document.getElementById('mute').onclick=()=>{muted=!muted;document.getElementById('mute').textContent=muted?'🔇':'🔊';if(!muted)ambience()};
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();flap()}});
c.addEventListener('pointerdown',e=>{if(e.target===c)flap()});

function cycleWorld(dt){
 worldTime+=dt;
 if(worldTime>SEASON_CYCLE){worldTime=0;seasonIndex=(seasonIndex+1)%4;weatherIndex=(weatherIndex+1)%4}
}
function bg(){
 const s=seasons[seasonIndex];
 const nextS=seasons[(seasonIndex+1)%4];
 const phase=(worldTime/26);

 const blendP=Math.max(0,(worldTime-(SEASON_CYCLE-SEASON_BLEND))/SEASON_BLEND);

 const skyA=blendP>0?lerpColor(s.sky1,nextS.sky1,blendP):s.sky1;
 const skyB=blendP>0?lerpColor(s.sky2,nextS.sky2,blendP):s.sky2;
 const groundColor=blendP>0?lerpColor(s.ground,nextS.ground,blendP):s.ground;

 let grad=x.createLinearGradient(0,0,0,H);grad.addColorStop(0,skyA);grad.addColorStop(1,skyB);x.fillStyle=grad;x.fillRect(0,0,W,H);
 const night=(seasonIndex===2&&phase>.58&&blendP<.5);
 if(night){
   x.fillStyle='#17243e';x.globalAlpha=1-blendP;x.fillRect(0,0,W,H);x.globalAlpha=1;
   for(let i=0;i<45;i++){let sx=(i*97+t*.002)%W,sy=(i*53)%H*.58;x.globalAlpha=(.35+.35*Math.sin(t*.003+i))*(1-blendP);x.fillStyle='#fff';x.fillRect(sx,sy,1.6,1.6)}
   x.globalAlpha=1;x.fillStyle='#f5f2d2';x.beginPath();x.arc(W*.78,110,39,0,Math.PI*2);x.fill();
   x.fillStyle='#17243e';x.beginPath();x.arc(W*.80,98,35,0,Math.PI*2);x.fill();
 }else{
   x.fillStyle='#fff9d8';x.shadowBlur=30;x.shadowColor='#fff';x.beginPath();x.arc(W*.78,105,42,0,Math.PI*2);x.fill();x.shadowBlur=0;
 }
 x.fillStyle='#5f967d88';x.beginPath();x.moveTo(0,H*.72);for(let i=0;i<=W;i+=70)x.lineTo(i,H*.61+Math.sin(i*.018)*45);x.lineTo(W,H);x.lineTo(0,H);x.fill();
 x.globalAlpha=.45;
 for(let i=0;i<W;i+=58){let yy=H*.735+(i%90)*.10;tree(i,yy,15+(i%3)*4,blendP)}
 x.globalAlpha=.75;
 for(let i=20;i<W;i+=78){let yy=H*.765+(i%55)*.08;tree(i,yy,12+(i%4)*3,blendP)}
 x.globalAlpha=1;
 x.fillStyle=groundColor;x.fillRect(0,H*.80,W,H*.20);
 x.fillStyle='#ffffff18';x.fillRect(0,H*.80,W,3);
 const winterAlpha=seasonIndex===2?(1-blendP):(((seasonIndex+3)%4===2)?blendP:0);
 if(winterAlpha>0){x.globalAlpha=winterAlpha;x.fillStyle='#eef5f8';x.fillRect(0,H*.79,W,H*.21);x.globalAlpha=1}

 // ---- lightning flash overlay for STORM weather ----
 if(lightningFlash>0){
   x.fillStyle=`rgba(255,255,255,${Math.min(.55,lightningFlash)})`;
   x.fillRect(0,0,W,H);
 }
}
function tree(tx,ty,r,blendP){
 x.fillStyle='#5b4030';x.fillRect(tx-4,ty-r*.15,8,r*1.2);
 const curColor=seasonIndex===1?'#a85b3e':'#2d7750';
 const nextColor=((seasonIndex+1)%4)===1?'#a85b3e':'#2d7750';
 x.fillStyle=(blendP||0)>0?lerpColor(curColor,nextColor,blendP):curColor;
 x.beginPath();x.arc(tx,ty-r*.45,r,0,Math.PI*2);x.fill();
 x.beginPath();x.arc(tx-r*.55,ty-r*.1,r*.7,0,Math.PI*2);x.fill();
 x.beginPath();x.arc(tx+r*.55,ty-r*.1,r*.7,0,Math.PI*2);x.fill();
}
function drawClouds(dt){
 for(const q of clouds){q.x-=q.v*dt;if(q.x<-130)q.x=W+80;
   x.globalAlpha=.55;x.fillStyle='#fff';x.beginPath();x.arc(q.x,q.y,q.s*.45,0,Math.PI*2);x.arc(q.x+q.s*.38,q.y-10,q.s*.34,0,Math.PI*2);x.arc(q.x+q.s*.72,q.y+3,q.s*.5,0,Math.PI*2);x.fill()
 }x.globalAlpha=1;
}
function drawWeather(dt){
 const w=weather[weatherIndex];
 if(w==='RAIN'){
   x.strokeStyle='#ffffff55';x.lineWidth=1.4;
   for(let i=0;i<70;i++){let rx=(i*83+t*.12)%W,ry=(i*47+t*.42)%H*.82;x.beginPath();x.moveTo(rx,ry);x.lineTo(rx-4,ry+12);x.stroke()}
 } else if(w==='SNOW'){
   x.fillStyle='#fff';
   for(let i=0;i<55;i++){let sx=(i*67+t*.02)%W,sy=(i*41+t*.035)%H*.82;x.globalAlpha=.5+.4*Math.sin(t*.001+i);x.beginPath();x.arc(sx,sy,1.5+(i%3),0,Math.PI*2);x.fill()}x.globalAlpha=1;
 } else if(w==='STORM'){
   // darker sky tint + heavier rain
   x.fillStyle='#10182a55';x.fillRect(0,0,W,H);
   x.strokeStyle='#ffffff77';x.lineWidth=2;
   for(let i=0;i<110;i++){let rx=(i*61+t*.2)%W,ry=(i*37+t*.6)%H*.82;x.beginPath();x.moveTo(rx,ry);x.lineTo(rx-6,ry+18);x.stroke()}
   lightningCooldown-=dt;
   if(lightningCooldown<=0){
     lightningFlash=1;lightningCooldown=3+Math.random()*4;
     sfx('thunder');
   }
 } else if(seasonIndex===1){
   x.fillStyle='#d99a55';
   for(let i=0;i<22;i++){let lx=(i*91+t*.03)%W,ly=(i*57+t*.045)%H*.78;x.save();x.translate(lx,ly);x.rotate(t*.001+i);x.fillRect(-2,-5,4,10);x.restore()}
 }
 if(lightningFlash>0){lightningFlash=Math.max(0,lightningFlash-dt*2.5)}
}
function pipe(p){
  const top=p.cy-p.gap/2, bot=p.cy+p.gap/2;
  const capH=p.capH||18, over=p.capOver||7;
  const groundY=H*.80;

  x.save();
  x.shadowBlur=12;
  x.shadowColor=p.color;
  x.fillStyle=p.color;
  x.fillRect(p.x,0,p.w,Math.max(0,top-capH));
  x.fillRect(p.x,bot+capH,p.w,Math.max(0,groundY-(bot+capH)));

  x.beginPath();x.roundRect(p.x-over,top-capH,p.w+over*2,capH,7);x.fill();
  x.beginPath();x.roundRect(p.x-over,bot,p.w+over*2,capH,7);x.fill();
  x.shadowBlur=0;

  x.fillStyle='#ffffff48';
  x.fillRect(p.x+9,0,8,Math.max(0,top-capH));
  x.fillRect(p.x+9,bot+capH,8,Math.max(0,groundY-(bot+capH)));

  x.fillStyle='#00000020';
  x.fillRect(p.x+p.w-10,0,10,Math.max(0,top-capH));
  x.fillRect(p.x+p.w-10,bot+capH,10,Math.max(0,groundY-(bot+capH)));

  x.restore();
}
function item(it){
  if(it.got)return;
  const yy=it.y+Math.sin(t*.0035+it.seed)*3;
  x.save();
  x.translate(it.x,yy);

  if(it.type==='coin'){
    const spin=t*.0045+it.seed;
    const scaleX=Math.max(.16,Math.abs(Math.cos(spin)));
    x.scale(scaleX,1);
    x.shadowBlur=16;x.shadowColor='#ffd54a';
    const coin=x.createRadialGradient(-4,-6,1,0,0,15);
    coin.addColorStop(0,'#fff7b0');coin.addColorStop(.28,'#ffe36a');coin.addColorStop(.65,'#e8a91e');coin.addColorStop(1,'#a86b0c');
    x.fillStyle=coin;x.beginPath();x.arc(0,0,14,0,Math.PI*2);x.fill();
    x.shadowBlur=0;
    x.strokeStyle='#fff0a0';x.lineWidth=1.5;x.beginPath();x.arc(0,0,11,0,Math.PI*2);x.stroke();
    x.fillStyle='#fff8c7';x.globalAlpha=.75;x.beginPath();x.ellipse(-4,-5,3,6,0,0,Math.PI*2);x.fill();x.globalAlpha=1;
    x.fillStyle='#b77a13';x.font='bold 10px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('★',0,1);
  } else if(it.type==='shield'){
    x.shadowBlur=16;x.shadowColor='#62d8ff';x.fillStyle='#58cfff';
    x.beginPath();x.arc(0,0,15,0,Math.PI*2);x.fill();x.shadowBlur=0;
    x.fillStyle='#fff';x.font='bold 16px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('✦',0,1);
  } else if(it.type==='rocket'){
    x.shadowBlur=15;x.shadowColor='#ff9c4a';
    const rg=x.createRadialGradient(-3,-3,1,0,0,16);
    rg.addColorStop(0,'#fff2c9');rg.addColorStop(.4,'#ff9a3d');rg.addColorStop(1,'#e0511e');
    x.fillStyle=rg;
    x.beginPath();x.moveTo(-16,0);x.lineTo(9,-9);x.quadraticCurveTo(19,0,9,9);x.closePath();x.fill();
    x.shadowBlur=0;
    x.fillStyle='#ffd35c';x.beginPath();x.moveTo(-18,0);x.lineTo(-28,-6);x.lineTo(-24,0);x.lineTo(-28,6);x.closePath();x.fill();
    x.fillStyle='#7fd8ff';x.beginPath();x.arc(-1,0,4,0,Math.PI*2);x.fill();
  } else if(it.type==='magnet'){
    // horseshoe magnet icon: red arms with silvery magnetic tips
    x.shadowBlur=14;x.shadowColor='#ff5a5a';
    x.strokeStyle='#e23b3b';x.lineWidth=8;x.lineCap='round';
    x.beginPath();x.arc(0,2,11,Math.PI*0.15,Math.PI*0.85,false);x.stroke();
    x.shadowBlur=0;
    x.strokeStyle='#e2e6ea';x.lineWidth=8;x.lineCap='round';
    x.beginPath();x.moveTo(-11,2);x.lineTo(-11,-9);x.stroke();
    x.beginPath();x.moveTo(11,2);x.lineTo(11,-9);x.stroke();
  }
  x.restore();
}
function drawBird(){
 const skin=birdSkins[selectedSkin];
 x.save();x.translate(bird.x,bird.y);x.rotate(bird.rot);
 if(shieldTimer>0){x.strokeStyle='#73ddffbb';x.lineWidth=5;x.shadowBlur=22;x.shadowColor='#4bdcff';x.beginPath();x.arc(0,0,29+Math.sin(t*.012)*2,0,Math.PI*2);x.stroke();x.shadowBlur=0}
 if(magnetTimer>0){
   x.strokeStyle='#ff5a5abb';x.lineWidth=3;x.shadowBlur=16;x.shadowColor='#ff5a5a';
   x.beginPath();x.arc(0,0,34+Math.sin(t*.02)*4,0,Math.PI*2);x.stroke();
   x.globalAlpha=.4;x.beginPath();x.arc(0,0,42+Math.sin(t*.018+1)*5,0,Math.PI*2);x.stroke();x.globalAlpha=1;
   x.shadowBlur=0;
 }
 if(rocketTimer>0){
   x.save(); x.translate(-6,6);
   for(let i=0;i<4;i++){
     const off=i*11+ (t*.05)%11;
     x.globalAlpha=.28*(1-i/4);
     x.fillStyle='#cfd6dc';
     x.beginPath();x.arc(-38-off,(Math.sin(t*.01+i)*3),5+i*1.4,0,Math.PI*2);x.fill();
   }
   x.globalAlpha=1;
   const flick=0.85+Math.sin(t*.045)*.15+Math.random()*.08;
   x.shadowBlur=22;x.shadowColor='#ff8a35';
   let flameOuter=x.createLinearGradient(-30*flick,0,-58*flick,0);
   flameOuter.addColorStop(0,'#ffd35c');flameOuter.addColorStop(.5,'#ff8a35');flameOuter.addColorStop(1,'#ff8a3500');
   x.fillStyle=flameOuter;
   x.beginPath();x.moveTo(-28,7);x.quadraticCurveTo(-46*flick,3,-58*flick,0);x.quadraticCurveTo(-46*flick,-3,-28,-7);x.closePath();x.fill();
   x.shadowBlur=14;x.shadowColor='#fff2c9';
   let flameInner=x.createLinearGradient(-28,0,-42*flick,0);
   flameInner.addColorStop(0,'#ffffff');flameInner.addColorStop(.6,'#ffe58a');flameInner.addColorStop(1,'#ffb14d00');
   x.fillStyle=flameInner;
   x.beginPath();x.moveTo(-27,3.5);x.quadraticCurveTo(-36*flick,1.5,-42*flick,0);x.quadraticCurveTo(-36*flick,-1.5,-27,-3.5);x.closePath();x.fill();
   x.shadowBlur=0;
   let bodyGrad=x.createLinearGradient(0,-11,0,11);
   bodyGrad.addColorStop(0,'#ffffff');bodyGrad.addColorStop(.5,'#eef2f6');bodyGrad.addColorStop(1,'#b7c2cc');
   x.fillStyle=bodyGrad;x.beginPath();x.roundRect(-26,-10,50,20,10);x.fill();
   x.fillStyle='#ff4d4d';x.beginPath();x.moveTo(16,-10);x.quadraticCurveTo(32,0,16,10);x.closePath();x.fill();
   x.fillStyle='#ffffff55';x.beginPath();x.moveTo(16,-6);x.quadraticCurveTo(24,0,16,4);x.closePath();x.fill();
   x.fillStyle='#3d5266';x.beginPath();x.arc(-2,0,7.5,0,Math.PI*2);x.fill();
   x.fillStyle='#7fe0ff';x.beginPath();x.arc(-2,0,5.5,0,Math.PI*2);x.fill();
   x.fillStyle='#ffffff90';x.beginPath();x.arc(-4,-2,2,0,Math.PI*2);x.fill();
   x.fillStyle='#24384d';
   x.beginPath();x.moveTo(-13,9);x.lineTo(-20,20);x.lineTo(-7,10);x.closePath();x.fill();
   x.beginPath();x.moveTo(7,9);x.lineTo(0,20);x.lineTo(13,10);x.closePath();x.fill();
   x.fillStyle='#3a5470';
   x.beginPath();x.moveTo(-13,-9);x.lineTo(-20,-20);x.lineTo(-7,-10);x.closePath();x.fill();
   x.beginPath();x.moveTo(7,-9);x.lineTo(0,-20);x.lineTo(13,-10);x.closePath();x.fill();
   x.restore();
 }
 let body=x.createRadialGradient(-7,-8,2,3,3,27);body.addColorStop(0,skin.body[0]);body.addColorStop(.25,skin.body[1]);body.addColorStop(1,skin.body[2]);
 x.fillStyle=body;x.shadowBlur=9;x.shadowColor='#17233366';x.beginPath();x.ellipse(0,0,24,18,0,0,Math.PI*2);x.fill();x.shadowBlur=0;
 x.fillStyle=skin.helmet;x.beginPath();x.ellipse(-3,-12,15,6,0,0,Math.PI*2);x.fill();
 x.fillStyle=skin.wing;x.beginPath();x.moveTo(-5,3);x.quadraticCurveTo(-22,4,-18,16);x.quadraticCurveTo(-7,14,5,8);x.closePath();x.fill();
 x.strokeStyle=skin.wingLine;x.lineWidth=2;x.beginPath();x.moveTo(-8,7);x.lineTo(-18,11);x.stroke();
 x.fillStyle='#fff';x.beginPath();x.arc(10,-6,7,0,Math.PI*2);x.fill();x.fillStyle='#17202b';x.beginPath();x.arc(12,-6,3,0,Math.PI*2);x.fill();
 x.fillStyle='#f0a83b';x.beginPath();x.moveTo(20,-2);x.lineTo(35,3);x.lineTo(20,8);x.closePath();x.fill();
 x.fillStyle=skin.cheek;x.globalAlpha=.8;x.beginPath();x.arc(17,8,3,0,Math.PI*2);x.fill();x.globalAlpha=1;
 x.restore();
}
function collideCircleRect(cx,cy,r,rx,ry,rw,rh){
  const nx=Math.max(rx,Math.min(cx,rx+rw));
  const ny=Math.max(ry,Math.min(cy,ry+rh));
  return (cx-nx)**2+(cy-ny)**2<r*r;
}
function pipeCollision(p){
  const r=14;
  const top=p.cy-p.gap/2;
  const bot=p.cy+p.gap/2;
  const capH=p.capH||18, over=p.capOver||7;
  const groundY=H*.80;
  return (
    collideCircleRect(bird.x,bird.y,r,p.x,0,p.w,Math.max(0,top-capH)) ||
    collideCircleRect(bird.x,bird.y,r,p.x-over,top-capH,p.w+over*2,capH) ||
    collideCircleRect(bird.x,bird.y,r,p.x-over,bot,p.w+over*2,capH) ||
    collideCircleRect(bird.x,bird.y,r,p.x,bot+capH,p.w,Math.max(0,groundY-(bot+capH)))
  );
}
function update(dt){
 t+=dt*1000; if(state!=='play')return;
 cycleWorld(dt);
 bird.vy+=690*dt;
  bird.y+=bird.vy*dt;
  bird.rot=Math.max(-.55,Math.min(1.0,bird.vy*.0022));

 const progressiveSpeed=Math.min(1.9,score*.045);
 let speed=1.65+progressiveSpeed+(rocketTimer>0?1.45:0);

 for(const p of pipes)p.x-=speed*dt*60;

 // ---- magnet: pull nearby coins toward bird ----
 for(const it of items){
   it.x-=speed*dt*60;
   if(magnetTimer>0 && it.type==='coin' && !it.got){
     const dx=bird.x-it.x, dy=bird.y-it.y, dist=Math.hypot(dx,dy);
     if(dist<230 && dist>1){
       const pull=320*dt;
       it.x+=(dx/dist)*pull;
       it.y+=(dy/dist)*pull;
     }
   }
 }

 if(pipes.length && pipes[pipes.length-1].x<W-235)spawnPipe();
 pipes=pipes.filter(p=>p.x+p.w>-20);items=items.filter(it=>it.x>-30&&!it.got);
 for(const p of pipes){
   if(!p.passed&&p.x+p.w<bird.x){p.passed=true;score++}
   if(rocketTimer<=0&&shieldTimer<=0&&pipeCollision(p)){gameOver();return;}
 }
 for(const it of items){
   const itemY=it.y+Math.sin(t*.0035+(it.seed||0))*3;
    if(Math.hypot(bird.x-it.x,bird.y-itemY)<28){
     it.got=true;
     if(it.type==='coin'){score+=2;sfx('coin')}
     if(it.type==='shield'){shieldTimer=6;sfx('shield')}
     if(it.type==='rocket'){rocketTimer=4;sfx('rocket')}
     if(it.type==='magnet'){magnetTimer=7;sfx('magnet')}
     for(let i=0;i<12;i++)parts.push({x:it.x,y:it.y,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,life:1,type:it.type})
   }
 }
 if(shieldTimer>0)shieldTimer-=dt;if(rocketTimer>0)rocketTimer-=dt;if(magnetTimer>0)magnetTimer-=dt;
 if(bird.y-bird.r<0||bird.y+bird.r>H*.80)gameOver();
 for(const p of parts){
    p.x+=p.vx*60*dt;
    p.y+=p.vy*60*dt;
    p.life-=dt*2;
  }
 parts=parts.filter(p=>p.life>0);
}
function render(dt){
 bg();drawClouds(dt);
 for(const p of pipes)pipe(p);for(const it of items)item(it);
 drawWeather(dt);
 for(const p of parts){x.globalAlpha=p.life;x.fillStyle=p.type==='coin'?'#ffe06b':p.type==='shield'?'#67ddff':p.type==='magnet'?'#ff5a5a':'#ff7b32';x.beginPath();x.arc(p.x,p.y,3,0,Math.PI*2);x.fill()}x.globalAlpha=1;
 drawBird();
 document.getElementById('score').textContent=score;
 const s=seasons[seasonIndex].name, w=weather[weatherIndex];
 document.getElementById('world').textContent=`${s} • ${w}${rocketTimer>0?' • ROCKET':''}${shieldTimer>0?' • SHIELD':''}${magnetTimer>0?' • MAGNET':''}`;
}
function loop(now){let dt=Math.min(.033,(now-last)/1000||.016);last=now;update(dt);render(dt);requestAnimationFrame(loop)}
reset();requestAnimationFrame(loop);
</script>
